[project]
name = "inlog-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10,<4",
    "pandas>=3.0,<4",
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "claude-agent-sdk>=0.1.46,<1",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.22,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
markers = [
    "smoke: fast sanity checks run by default on every invocation",
    "integration: hits the real Claude agent (slow, needs ANTHROPIC_API_KEY)",
]
addopts = "-m smoke"
